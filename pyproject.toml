[tool.poetry]
name = "corecontext"
version = "0.1.0"
description = "AST-based LLM token pruner for generating minimal codebase contexts"
authors = ["Antigravity <antigravity@google.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.1.7"
rich = "^13.7.1"
tiktoken = "^0.5.0"
pathspec = "^0.12.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"

[tool.poetry.scripts]
corecontext = "src.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
